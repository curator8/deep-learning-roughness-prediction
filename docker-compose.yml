services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      MODEL_CHECKPOINT: /app/outputs/unet_skip_connections.pth
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: simple-textured-mesh/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
